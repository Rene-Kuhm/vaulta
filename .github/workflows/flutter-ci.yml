name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The lint task compares the sources against the base of the change
          # (the parent of the checked out commit), so the history has to
          # reach it.
          fetch-depth: 0

      - name: Set up the hermetic toolchain
        # mise installs the exact versions of mise.toml (Flutter, Node and
        # Python) with the checksums of mise.lock, and exports them to the
        # next steps. The runner uses the same toolchain as the local clone.
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # The mise that generated mise.lock, so the lockfile is resolved
          # with the same rules in the CI and in the local clone.
          version: 2026.10.17

      - name: Install the dependencies
        run: mise run deps

      - name: Lint
        # The analyzer and the format check of the files the change touches.
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Test with coverage
        # The gate does not change: the task runs the suite with coverage and
        # then scripts/check_coverage.sh with the same threshold.
        # Baseline 52.4% (measured 2026-06-11), initial threshold 50%.
        # Raised to 60% with the 60.5% measurement (756/1249, 2026-10-19,
        # Flutter 3.47.7) rounded down to the multiple of 5
        # (see docs/adr/0005-repository-hygiene-lints-and-coverage.md).
        run: mise run coverage

  pr-title:
    name: Conventional Commits title
    # The merges into `master` are squash merges, so the title of the pull
    # request is the commit message that lands on the branch. release-please
    # reads those commits to compute the next SemVer version and to write the
    # changelog, so a pull request whose title is not a Conventional Commit
    # would be invisible to the release automation. The same rules run
    # locally in the `commit-msg` hook of `lefthook.yml`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install the commit tooling
        # `--ignore-scripts` keeps `npm ci` from touching the git hooks of the
        # runner, which are not used in CI.
        run: npm ci --ignore-scripts

      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | npx commitlint || {
            echo "::error::The title of the pull request has to be a Conventional Commit (for example 'feat(ui): add the vault filter'), because the squash merge turns it into the commit that lands on master."
            exit 1
          }

  build-windows:
    # Build-only smoke test so Windows-specific breakage (plugins,
    # CMake, runner) is caught on the PR instead of at release time.
    if: github.event_name == 'pull_request'
    # windows-latest now ships VS 18 (MSVC 14.51), where <experimental/coroutine>
    # — still used by local_auth_windows — is a hard C2338 error instead of a
    # warning. Pin the image so the smoke test keeps catching Vaulta breakage
    # instead of failing on an upstream toolchain deprecation; the real fix is
    # bumping local_auth_windows when it drops experimental/<coroutine>.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up the hermetic toolchain
        # The same mise and the same mise.lock as the analyze-test job, so the
        # smoke test builds with the Flutter of the local clone.
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # The mise that generated mise.lock, so the lockfile is resolved
          # with the same rules in the CI and in the local clone.
          version: 2026.10.17

      - name: Install the dependencies
        run: mise run deps

      - name: Build Windows release
        run: mise run build
