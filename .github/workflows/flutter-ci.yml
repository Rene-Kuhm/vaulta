name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test with coverage
        run: flutter test --coverage

      - name: Check core coverage threshold
        # Baseline 52.4% (medido 2026-06-11), umbral inicial 50%.
        # Subido a 60% con la medicion 60.5% (756/1249, 2026-10-19,
        # Flutter 3.47.7) redondeada hacia abajo al multiplo de 5
        # (ver docs/architecture/ADR-005-repo-hygiene.md).
        run: bash scripts/check_coverage.sh coverage/lcov.info lib/core/security 60

  build-windows:
    # Build-only smoke test so Windows-specific breakage (plugins,
    # CMake, runner) is caught on the PR instead of at release time.
    if: github.event_name == 'pull_request'
    # windows-latest now ships VS 18 (MSVC 14.51), where <experimental/coroutine>
    # — still used by local_auth_windows — is a hard C2338 error instead of a
    # warning. Pin the image so the smoke test keeps catching Vaulta breakage
    # instead of failing on an upstream toolchain deprecation; the real fix is
    # bumping local_auth_windows when it drops experimental/<coroutine>.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release
