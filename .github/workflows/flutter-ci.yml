name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test with coverage
        run: flutter test --coverage

      - name: Check core coverage threshold
        # Baseline 52.4% (medido 2026-06-11). Umbral inicial 50% con plan
        # trimestral de subida (ver docs/architecture/ADR-005-repo-hygiene.md).
        run: bash scripts/check_coverage.sh coverage/lcov.info lib/core/security 50
