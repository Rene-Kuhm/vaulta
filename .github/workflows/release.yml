name: Release

# Cuts a stable release when a `vX.Y.Z` tag is pushed.
#
# Pipeline:
#   1. verify   - the tag must equal the pubspec version name and the
#                 CHANGELOG must contain a section for it.
#   2. android  - analyze + test, then build the signed release APK
#                 with the same VAULTA_UPLOAD_* secrets used by
#                 dev-apk-release.yml (same key => in-place updates).
#   3. windows  - build the Windows release bundle and zip it with the
#                 executable renamed to `vaulta.exe`.
#   4. publish  - generate a CycloneDX SBOM of the Dart dependencies,
#                 sign every asset with a keyless Sigstore build
#                 provenance attestation (OIDC, no stored signing key),
#                 attest the SBOM to the artifacts, generate SHA256SUMS
#                 and create the GitHub Release with the CHANGELOG
#                 section as notes.
#
# The in-app updater reads /releases/latest and refuses any APK whose
# SHA-256 is not listed in the release's SHA256SUMS, so publishing
# without that file would break updates by design.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify tag matches pubspec
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only commits already merged to master (i.e. reviewed through a
      # PR with green CI) may become a stable release.
      - name: Require tagged commit to be on master
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tagged commit $GITHUB_SHA is not on origin/master; refusing to release"
            exit 1
          fi

      - name: Compare tag with pubspec version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          test -n "$VERSION" || { echo "Could not read pubspec version"; exit 1; }
          VERSION_NAME="${VERSION%%+*}"
          if [ "v${VERSION_NAME}" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match pubspec version $VERSION (expected v${VERSION_NAME})"
            exit 1
          fi
          if ! grep -q "^## \[${VERSION_NAME}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION_NAME}]' section"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

  android:
    name: Build signed APK
    needs: verify
    runs-on: ubuntu-latest
    # Signing secrets live in the `release` environment, which requires
    # a reviewer's approval (see docs/release-process.md).
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Secrets are passed through env and referenced as "$VAR" so they
      # are never interpolated into the script text. The keystore lives
      # in $RUNNER_TEMP (outside the checkout) and is always deleted.
      - name: Validate signing secrets
        env:
          VAULTA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.VAULTA_UPLOAD_KEYSTORE_BASE64 }}
          VAULTA_UPLOAD_STORE_PASSWORD: ${{ secrets.VAULTA_UPLOAD_STORE_PASSWORD }}
          VAULTA_UPLOAD_KEY_ALIAS: ${{ secrets.VAULTA_UPLOAD_KEY_ALIAS }}
          VAULTA_UPLOAD_KEY_PASSWORD: ${{ secrets.VAULTA_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$VAULTA_UPLOAD_KEYSTORE_BASE64" || { echo "Missing VAULTA_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "$VAULTA_UPLOAD_STORE_PASSWORD" || { echo "Missing VAULTA_UPLOAD_STORE_PASSWORD"; exit 1; }
          test -n "$VAULTA_UPLOAD_KEY_ALIAS" || { echo "Missing VAULTA_UPLOAD_KEY_ALIAS"; exit 1; }
          test -n "$VAULTA_UPLOAD_KEY_PASSWORD" || { echo "Missing VAULTA_UPLOAD_KEY_PASSWORD"; exit 1; }

      - name: Restore signing keystore
        env:
          VAULTA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.VAULTA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$VAULTA_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed APK
        env:
          VAULTA_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          VAULTA_UPLOAD_STORE_PASSWORD: ${{ secrets.VAULTA_UPLOAD_STORE_PASSWORD }}
          VAULTA_UPLOAD_KEY_ALIAS: ${{ secrets.VAULTA_UPLOAD_KEY_ALIAS }}
          VAULTA_UPLOAD_KEY_PASSWORD: ${{ secrets.VAULTA_UPLOAD_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" | tee apksigner.txt
          if grep -q "CN=Android Debug" apksigner.txt; then
            echo "::error::Release APK is signed with the debug key"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/vaulta.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/vaulta.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows bundle
    needs: verify
    # windows-latest ships VS 18 (MSVC 14.51), where <experimental/coroutine> — still used by
    # local_auth_windows — is a hard C2338 error instead of a warning. Pin the image so the
    # release bundle keeps building; the real fix is bumping local_auth_windows when it drops
    # experimental/<coroutine>.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'build/windows/x64/runner/Release'
          if (-not (Test-Path "$bundle/gestor_contrasenas.exe")) {
            throw "Expected $bundle/gestor_contrasenas.exe after flutter build windows"
          }
          Rename-Item "$bundle/gestor_contrasenas.exe" 'vaulta.exe'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath 'dist/vaulta-windows-bundle.zip'

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/vaulta-windows-bundle.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [verify, android, windows]
    runs-on: ubuntu-latest
    environment: release
    # contents: publish the release. id-token + attestations: the keyless
    # Sigstore signing of actions/attest-* needs a fresh OIDC token and
    # the write half of the artifact attestation API.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # cdxgen parses pubspec.lock directly (no `pub get`, no Dart SDK
      # needed), so the SBOM is reproducible in this job without a
      # Flutter toolchain. The generator is installed into $RUNNER_TEMP
      # and pinned by version so the SBOM does not drift with `npx`.
      - name: Generate CycloneDX SBOM
        env:
          CDXGEN_VERSION: 12.9.0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npm install "@cyclonedx/cdxgen@$CDXGEN_VERSION" --no-audit --no-fund
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/node_modules/.bin/cdxgen" \
            -t pub --no-install-deps \
            -o "$RUNNER_TEMP/sbom.cdx.json" .
          cp "$RUNNER_TEMP/sbom.cdx.json" dist/sbom.cdx.json

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum vaulta.apk vaulta-windows-bundle.zip sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          VERSION_NAME: ${{ needs.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          SECTION=$(awk -v v="$VERSION_NAME" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          test -n "$SECTION" || { echo "::error::Empty CHANGELOG section for $VERSION_NAME"; exit 1; }
          {
            # The in-app updater parses this line to compare builds.
            echo "Version: ${VERSION}"
            echo
            echo "$SECTION"
            echo
            echo "## Verify downloads"
            echo
            echo "Every asset is listed in \`SHA256SUMS\`. Verify with:"
            echo
            echo '```'
            echo 'sha256sum --check --ignore-missing SHA256SUMS'
            echo '```'
            echo
            echo "## Software supply chain"
            echo
            echo "Every artifact carries a keyless Sigstore build provenance attestation"
            echo "(SLSA v1.0, signed with the workflow's OIDC identity — no stored signing"
            echo "key) and a CycloneDX SBOM attestation of the Dart dependencies. Verify"
            echo "with the GitHub CLI:"
            echo
            echo '```'
            echo "gh attestation verify vaulta.apk -R $GITHUB_REPOSITORY"
            echo "gh attestation verify vaulta-windows-bundle.zip -R $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "\`sbom.cdx.json\` is the plain CycloneDX SBOM; the attested copy is in the"
            echo "repository's attestation store."
          } > release-notes.md

      # Keyless signing: the actions/attest-* actions mint a short-lived
      # OIDC token for this exact workflow run, sign with Sigstore, and
      # store the attestation in the repository's attestation store.
      # There is no long-lived signing key to leak or rotate.
      - name: Attest build provenance (Sigstore, keyless)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/vaulta.apk
            dist/vaulta-windows-bundle.zip

      - name: Attest SBOM to the artifacts
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-path: |
            dist/vaulta.apk
            dist/vaulta-windows-bundle.zip
          sbom-path: dist/sbom.cdx.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VAULTA_RELEASE_TOKEN || github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/vaulta.apk \
            dist/vaulta-windows-bundle.zip \
            dist/sbom.cdx.json \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Vaulta $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest
