# Doctest plan for the repository documentation.
#
# `mise run docs-test` (scripts/docs-test/run.py) executes the examples of the
# documentation. This plan declares every executable block of the scope below,
# so the gate knows what to run and why it does not run the rest.
#
# Scope: README.md and docs/ (see `plan.documents`).
#
# A block is executable when the runner can run it with the hermetic toolchain:
#
#   * a POSIX shell script (`bash`, `sh`, `shell`, `zsh`);
#   * a shell transcript: a block whose body holds `$ ` prompts with the output
#     the command printed;
#   * a SQL block, which is executable only against a live database and is
#     therefore always a `skip`;
#   * a PowerShell script, which only runs on Windows and is therefore always a
#     `skip`.
#
# Data blocks (JSON, YAML, TOML, properties, Mermaid, prose and the output of a
# test run) are examples, not commands: they are not part of this plan.
#
# Every declaration has one of these modes:
#
#   * `task`: the runner executes the block and the gate fails when it breaks.
#   * `skip`: the runner does not execute the block; `reason` says why.
#
# `reason` is mandatory: a skip without a reason is a plan problem.
#
# `language` and `kind` say what the block is: `script` (a POSIX shell script),
# `transcript` (a session with `$ ` prompts), `sql` or `powershell`. The runner
# fails when the documentation and the plan disagree about them.
#
# `index` is the position of the block among the executable blocks of its file,
# counted from 1. The runner fails when a block appears, disappears or changes
# its language or kind, so this file cannot rot into a list that no longer
# describes the documentation.

[plan]
version = 1
documents = ["README.md", "docs"]

# --- README.md -------------------------------------------------------------

[[block]]
file = "README.md"
index = 1
language = "bash"
kind = "script"
mode = "skip"
reason = "The block installs the toolchain, resolves the packages and launches the app: it needs the network and a device."

